<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body>
  <div class="bg-grid"></div>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand">
        <div class="logo-dot"></div>
        <div>
          <h1>Rover Fleet Control</h1>
          <p>Безопасная диспетчеризация автономных мини-роверов</p>
        </div>
      </div>

      <form method="post" class="auth-form">
        <label>
          Логин
          <input name="username" placeholder="admin" autocomplete="username" required />
        </label>

        <label>
          Пароль
          <input name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </label>

        <button type="submit">Войти в панель</button>
      </form>

      <div class="auth-footer">
        <span>Рекомендация: меняйте пароль admin после первого входа.</span>
      </div>
    </section>
  </main>
</body>
</html>
