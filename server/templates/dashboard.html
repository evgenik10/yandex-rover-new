<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Fleet Panel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <aside id="sidebar"><h3>Rovers</h3><input id="search" placeholder="search"/><div id="rovers"></div></aside>
  <main>
    <h2>Dispatch Dashboard</h2>
    <div id="status">mode_desired: - / mode_reported: -</div>
    <section class="grid">
      <div class="cam">Front</div><div class="cam">Rear</div><div class="cam">Left</div><div class="cam">Right</div>
    </section>
    <div class="controls">
      <button onclick="sendMode('MANUAL')">MANUAL</button>
      <button onclick="sendMode('AUTO')">AUTO</button>
      <button onclick="sendStop()">STOP</button>
    </div>
  </main>
  <script>const USER_ROLE='{{ user_role }}';</script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
